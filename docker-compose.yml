services:
  whatsapp-bot:
    build: ./bot
    container_name: whatsapp-bot
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate && npm start"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finance_bot
      DB_USER: postgres
      DB_PASSWORD: password123
      CORS_ORIGIN: "http://localhost:8080"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      OTP_RESEND_COOLDOWN_SECONDS: 60
      OTP_RATE_LIMIT_WINDOW_SECONDS: 900
      OTP_MAX_REQUESTS_PER_WINDOW: 5
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "3001:3001"
    networks:
      - bot-network
    volumes:
      - ./bot/data:/app/data
      - ./bot/auth_info:/app/auth_info
    restart: unless-stopped

  web-ui:
    build:
      context: ./web
      args:
        BACKEND_URL: http://whatsapp-bot:3001
    container_name: whatsapp-bot-web
    depends_on:
      - whatsapp-bot
    environment:
      BACKEND_URL: http://whatsapp-bot:3001
    ports:
      - "8080:8080"
    networks:
      - bot-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: finance_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bot-network

volumes:
  postgres-data:

networks:
  bot-network:
