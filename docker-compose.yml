services:
  whatsapp-bot:
    build: ./bot
    container_name: finance-whatsapp-bot
    command: sh -c "npm run migrate && npm start"
    environment:
      PORT: 3001
      DB_HOST: shared-postgres
      DB_PORT: 5432
      DB_NAME: finance_bot
      DB_USER: finance_bot_user
      DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      DATABASE_URL: postgresql://finance_bot_user:${FINANCE_DB_PASSWORD}@shared-postgres:5432/finance_bot?schema=public

      CORS_ORIGIN: ${CORS_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      OTP_RESEND_COOLDOWN_SECONDS: 60
      OTP_RATE_LIMIT_WINDOW_SECONDS: 900
      OTP_MAX_REQUESTS_PER_WINDOW: 5
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      - "3001:3001"
    networks:
      - finance-network
      - shared-backend
    volumes:
      - ./bot/data:/app/data
      - ./bot/auth_info:/app/auth_info
    restart: unless-stopped

  web-ui:
    build:
      context: ./web
      args:
        BACKEND_URL: http://whatsapp-bot:3001
    container_name: finance-web
    depends_on:
      - whatsapp-bot
    environment:
      BACKEND_URL: http://whatsapp-bot:3001
    ports:
      - "8080:8080"
    networks:
      - finance-network
    restart: unless-stopped

networks:
  finance-network:
  shared-backend:
    external: true