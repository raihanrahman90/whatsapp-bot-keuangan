services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    depends_on:
      - postgres
    command: sh -c "npm run migrate && npm start"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finance_bot
      DB_USER: postgres
      DB_PASSWORD: password123
    networks:
      - bot-network

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: finance_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bot-network

volumes:
  postgres-data:

networks:
  bot-network: