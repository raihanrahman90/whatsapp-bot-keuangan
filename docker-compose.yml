services:
  whatsapp-bot:
    build: ./bot
    container_name: whatsapp-bot
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate && npm start"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finance_bot
      DB_USER: postgres
      DB_PASSWORD: password123
    networks:
      - bot-network
    volumes:
      - ./bot/data:/app/data
      - ./bot/auth_info:/app/auth_info

  backend:
    build: ./backend
    container_name: whatsapp-bot-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finance_bot
      DB_USER: postgres
      DB_PASSWORD: password123
      CORS_ORIGIN: "http://localhost:8080"
    ports:
      - "3001:3001"
    networks:
      - bot-network
    restart: unless-stopped

  web-ui:
    build: ./web
    container_name: whatsapp-bot-web
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "8080:8080"
    networks:
      - bot-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: finance_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bot-network

volumes:
  postgres-data:

networks:
  bot-network: